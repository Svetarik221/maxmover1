version: '3.8'

services:
  bot:
    build: .
    env_file: .env
    depends_on:
      - db
      - redis
    volumes:
      - ./media_cache:/app/media_cache
      - ./sessions:/app/sessions
    restart: unless-stopped

  max_webhook:
    build: .
    command: python -u -m max_webhook.server
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "127.0.0.1:8443:8443"
    depends_on:
      - db
      - redis
    restart: unless-stopped

  celery_worker:
    build: .
    command: celery -A tasks.celery_app worker -l info --concurrency=1
    env_file: .env
    environment:
      - CELERY_WORKER=1
    depends_on:
      - db
      - redis
    volumes:
      - ./media_cache:/app/media_cache
      - ./sessions:/app/sessions
    restart: unless-stopped

  celery_beat:
    build: .
    command: celery -A tasks.celery_app beat -l info
    env_file: .env
    environment:
      - CELERY_WORKER=1
    depends_on:
      - redis
    restart: unless-stopped

  # DE-воркер: Telethon-сервис для переноса постов и обработки больших видео.
  # Telethon работает напрямую с TG (MTProto), поэтому не имеет лимита 20МБ.
  # Запускается на том же сервере что и бот (в open mode) или на отдельном
  # VPS вне РФ (тогда вынесите этот сервис в отдельный docker-compose).
  de_worker:
    build: .
    command: python -u de-worker/transfer_worker.py
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      # processed_jobs.json/processed_posts.json кладутся сюда — между рестартами не теряются
      - DEDUP_STATE_DIR=/app/de-worker
      - TELETHON_SESSION_PATH=/app/sessions/bot_session
      - TELETHON_MEDIA_DIR=/app/media_cache
    volumes:
      - ./sessions:/app/sessions
      - ./media_cache:/app/media_cache
      - ./de-worker:/app/de-worker
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: maxmover
      POSTGRES_USER: maxmover
      POSTGRES_PASSWORD: ${DB_PASSWORD:-maxmover}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6381:6379"
    restart: unless-stopped

volumes:
  pgdata:
